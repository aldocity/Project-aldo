<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Frame // Hand Detection</title>
<style>
  :root{
    --cyan: #5ee7ff;
    --cyan-dim: rgba(94,231,255,0.35);
    --panel-bg: rgba(8,14,20,0.55);
    --font-mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#05070a;
    overflow:hidden;
    font-family: var(--font-mono);
  }

  #stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }

  video, canvas{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%) scaleX(-1); /* mirror like a selfie cam */
    max-width:100%; max-height:100%;
  }

  #video{ z-index:1; }
  #canvas{ z-index:2; background:transparent; }

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    color: var(--cyan);
    text-shadow: 0 0 6px rgba(94,231,255,0.6);
    letter-spacing: 1px;
  }

  .hud-top-left{
    position:absolute;
    top:18px; left:18px;
    font-size:12px;
    text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }

  .hud-top-left .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--cyan);
    box-shadow:0 0 8px var(--cyan);
    animation: blink 1.4s infinite;
  }

  .hud-top-right{
    position:absolute;
    top:16px; right:18px;
    text-align:right;
    background: var(--panel-bg);
    border:1px solid var(--cyan-dim);
    padding:8px 12px;
    font-size:11px;
    line-height:1.6;
    text-transform:uppercase;
    min-width:150px;
    backdrop-filter: blur(2px);
  }

  .hud-top-right .label{ opacity:0.6; letter-spacing:1.5px; }
  .hud-top-right .title{ font-size:13px; font-weight:bold; letter-spacing:1.5px; }
  .hud-top-right .status{
    display:flex; align-items:center; gap:6px; justify-content:flex-end;
    margin-top:2px;
  }
  .hud-top-right .status .sq{
    width:6px; height:6px;
    background: #444;
  }
  .hud-top-right .status.on .sq{
    background: var(--cyan);
    box-shadow:0 0 6px var(--cyan);
  }

  .hud-bottom-left{
    position:absolute;
    bottom:16px; left:18px;
    font-size:10.5px;
    opacity:0.85;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .hud-bottom-right{
    position:absolute;
    bottom:16px; right:18px;
    font-size:10px;
    opacity:0.5;
    text-transform:uppercase;
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.15; }
  }

  #permission-overlay{
    position:absolute; inset:0;
    background:#05070a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; z-index:10;
    color:var(--cyan); font-family:var(--font-mono);
  }
  #permission-overlay button{
    background:transparent;
    border:1px solid var(--cyan);
    color:var(--cyan);
    padding:10px 22px;
    font-family:var(--font-mono);
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    font-size:12px;
  }
  #permission-overlay button:hover{ background:var(--cyan-dim); }
  #permission-overlay button:disabled{ opacity:0.4; cursor:default; }
  #permission-overlay p{ font-size:11px; opacity:0.6; max-width:320px; text-align:center; }
  #error-box{
    display:none;
    border:1px solid #ff5e5e;
    color:#ff9a9a;
    background:rgba(255,94,94,0.08);
    padding:10px 14px;
    font-size:11px;
    max-width:340px;
    text-align:left;
    white-space:pre-wrap;
    line-height:1.5;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="hud-top-left">
      <span class="dot"></span>
      <span>Cyber Frame // <span id="frame-state">Standby</span></span>
    </div>

    <div class="hud-top-right">
      <div class="label">Camera Node / 01</div>
      <div class="title">Subject Detection</div>
      <div class="status" id="hand-status">
        <span class="sq"></span><span id="hand-status-text">Hand Frame Inactive</span>
      </div>
    </div>

    <div class="hud-bottom-left">Efek hanya di dalam kotak.</div>
    <div class="hud-bottom-right">Bentuk kotak dgn dua tangan.</div>
  </div>

  <div id="permission-overlay">
    <div style="font-size:13px; letter-spacing:2px;">CYBER FRAME</div>
    <p>Website ini butuh akses kamera untuk mendeteksi tangan. Bentuk kotak/jendela dengan kedua tangan (ibu jari + telunjuk) untuk mengaktifkan efek.</p>
    <button id="start-btn">Aktifkan Kamera</button>
    <div id="error-box"></div>
  </div>
</div>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start-btn');
const overlay = document.getElementById('permission-overlay');
const frameStateEl = document.getElementById('frame-state');
const handStatusEl = document.getElementById('hand-status');
const handStatusTextEl = document.getElementById('hand-status-text');
const errorBox = document.getElementById('error-box');

let handLandmarker;
let running = false;
let lastVideoTime = -1;

function showError(msg){
  errorBox.style.display = 'block';
  errorBox.textContent = msg;
}
function clearError(){
  errorBox.style.display = 'none';
  errorBox.textContent = '';
}

// Camera access requires a "secure context": https://, or http://localhost / 127.0.0.1.
// Opening the file directly (file://) or over plain http on a non-localhost host will be blocked by the browser.
function checkSecureContext(){
  const isLocalhost = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  if(!window.isSecureContext && !isLocalhost){
    showError(
      "Kamera diblokir browser.\n\n" +
      "Penyebab: file ini dibuka langsung (protokol file://) atau lewat http:// bukan localhost.\n\n" +
      "Solusi: jalankan lewat local server, contoh:\n" +
      "- VS Code: klik kanan file > 'Open with Live Server'\n" +
      "- atau terminal: python3 -m http.server, lalu buka http://127.0.0.1:8000/cyber-frame.html\n\n" +
      "Kamera hanya bisa diakses lewat https:// atau http://localhost / 127.0.0.1."
    );
    return false;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showError("Browser ini tidak mendukung akses kamera (getUserMedia tidak tersedia). Coba pakai Chrome/Edge/Firefox versi terbaru.");
    return false;
  }
  return true;
}

async function initModel(){
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  try{
    handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
      baseOptions:{
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },
      runningMode:"VIDEO",
      numHands:2
    });
  }catch(gpuErr){
    // fallback: some browsers/devices don't support the GPU delegate
    handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
      baseOptions:{
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "CPU"
      },
      runningMode:"VIDEO",
      numHands:2
    });
  }
}

async function startCamera(){
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ width:1280, height:720, facingMode:"user" },
      audio:false
    });
  }catch(err){
    const map = {
      NotAllowedError: "Izin kamera ditolak. Klik ikon gembok/kamera di address bar browser dan izinkan akses kamera, lalu reload halaman.",
      NotFoundError: "Tidak ada kamera yang terdeteksi di perangkat ini.",
      NotReadableError: "Kamera sedang dipakai aplikasi lain (mis. video call/aplikasi kamera lain). Tutup aplikasi itu lalu coba lagi.",
      OverconstrainedError: "Kamera tidak mendukung resolusi yang diminta.",
      SecurityError: "Akses kamera diblokir karena halaman tidak dibuka lewat https:// atau localhost."
    };
    throw new Error(map[err.name] || (err.name + ": " + err.message));
  }
  video.srcObject = stream;
  await new Promise(res => video.onloadedmetadata = res);
  video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

function resizeCanvasToDisplay(){
  const stageRect = document.getElementById('stage').getBoundingClientRect();
  const scale = Math.min(stageRect.width / video.videoWidth, stageRect.height / video.videoHeight);
  canvas.style.width = (video.videoWidth * scale) + 'px';
  canvas.style.height = (video.videoHeight * scale) + 'px';
  video.style.width = (video.videoWidth * scale) + 'px';
  video.style.height = (video.videoHeight * scale) + 'px';
}

// order 4 points around their centroid so the polygon doesn't self-intersect
function orderQuad(points){
  const cx = points.reduce((s,p)=>s+p.x,0)/points.length;
  const cy = points.reduce((s,p)=>s+p.y,0)/points.length;
  return [...points].sort((a,b)=>{
    const angA = Math.atan2(a.y-cy, a.x-cx);
    const angB = Math.atan2(b.y-cy, b.x-cx);
    return angA - angB;
  });
}

let scanOffset = 0;

function drawCyberFrame(quad, t){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(quad[0].x, quad[0].y);
  for(let i=1;i<quad.length;i++) ctx.lineTo(quad[i].x, quad[i].y);
  ctx.closePath();
  ctx.clip();

  // translucent cyan fill
  ctx.fillStyle = "rgba(94,231,255,0.10)";
  ctx.fillRect(0,0,canvas.width, canvas.height);

  // moving scanlines inside the clipped region
  const minY = Math.min(...quad.map(p=>p.y));
  const maxY = Math.max(...quad.map(p=>p.y));
  const minX = Math.min(...quad.map(p=>p.x));
  const maxX = Math.max(...quad.map(p=>p.x));
  ctx.strokeStyle = "rgba(94,231,255,0.35)";
  ctx.lineWidth = 1;
  const spacing = 10;
  scanOffset = (scanOffset + 0.6) % spacing;
  for(let y = minY - spacing + scanOffset; y < maxY; y += spacing){
    ctx.beginPath();
    ctx.moveTo(minX, y);
    ctx.lineTo(maxX, y);
    ctx.stroke();
  }
  ctx.restore();

  // dashed border
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(quad[0].x, quad[0].y);
  for(let i=1;i<quad.length;i++) ctx.lineTo(quad[i].x, quad[i].y);
  ctx.closePath();
  ctx.setLineDash([6,5]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "#5ee7ff";
  ctx.shadowColor = "#5ee7ff";
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.restore();
}

function landmarkToCanvas(lm){
  return { x: lm.x * canvas.width, y: lm.y * canvas.height };
}

function renderLoop(){
  if(!running) return;
  const nowMs = performance.now();

  if(video.currentTime !== lastVideoTime){
    lastVideoTime = video.currentTime;
    const results = handLandmarker.detectForVideo(video, nowMs);

    ctx.clearRect(0,0,canvas.width, canvas.height);

    let frameActive = false;

    if(results.landmarks && results.landmarks.length === 2){
      const points = [];
      results.landmarks.forEach(hand=>{
        points.push(landmarkToCanvas(hand[4]));  // thumb tip
        points.push(landmarkToCanvas(hand[8]));  // index tip
      });
      const quad = orderQuad(points);
      drawCyberFrame(quad, nowMs);
      frameActive = true;
    }

    frameStateEl.textContent = frameActive ? "Active" : "Standby";
    handStatusTextEl.textContent = frameActive ? "Hand Frame Active" : "Hand Frame Inactive";
    handStatusEl.classList.toggle('on', frameActive);
  }

  requestAnimationFrame(renderLoop);
}

startBtn.addEventListener('click', async ()=>{
  clearError();
  if(!checkSecureContext()) return;

  startBtn.disabled = true;
  startBtn.textContent = "Membuka kamera...";
  try{
    // start the camera first so the user sees video feedback quickly
    await startCamera();
    startBtn.textContent = "Memuat model deteksi tangan...";
    await initModel();

    resizeCanvasToDisplay();
    window.addEventListener('resize', resizeCanvasToDisplay);
    overlay.style.display = 'none';
    running = true;
    renderLoop();
  }catch(err){
    startBtn.disabled = false;
    startBtn.textContent = "Coba Lagi";
    showError(err.message || String(err));
    console.error(err);
  }
});

// Give immediate feedback if the page is opened in a context where camera can never work
window.addEventListener('DOMContentLoaded', ()=>{
  checkSecureContext();
});
</script>

</body>
  </html>
